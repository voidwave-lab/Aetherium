name: Release Aetherium Desktop Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (when triggered manually, e.g., v0.3.0)'
        required: false
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies (WebKit2GTK & ALSA)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libasound2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Build Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build and Publish Desktop Installers via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name || 'v__VERSION__' }}"
          releaseName: "Aetherium ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name || 'v__VERSION__' }}"
          releaseBody: |
            ## Aetherium — Generative Soundscape & Receptive Music Therapy

            Download the native desktop installer for your operating system below:
            - **macOS (Apple Silicon M1/M2/M3/M4):** `Aetherium_..._aarch64.dmg`
            - **macOS (Intel):** `Aetherium_..._x64.dmg`
            - **Windows (10 / 11):** `Aetherium_..._x64-setup.exe` or `.msi`
            - **Linux (Ubuntu / Debian / Fedora):** `Aetherium_..._amd64.AppImage` or `.deb`

            *Zero external telemetry. All audio synthesis and clinical session presets run 100% locally on your machine.*
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
